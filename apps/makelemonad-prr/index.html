<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MakeLemonAd — Plano de Mídia</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4FA;--surface:#fff;--surface2:#E8EEF8;--border:#D1DCF0;
  --text:#0C1A2E;--muted:#536282;--faint:#8A9AB8;
  --accent:#1C4ED8;--accent-bg:#EBF4FF;--accent-hover:#1741B8;
  --green:#155724;--green-bg:#D4EDDA;--green-border:#C3E6CB;
  --red:#721C24;--red-bg:#F8D7DA;--red-border:#F5C6CB;
  --orange:#856404;--orange-bg:#FFF3CD;--orange-border:#FFEEBA;
  --blue:#004085;--blue-bg:#CCE5FF;--blue-border:#B8DAFF;
  --yellow:#D6DE23;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  --radius:10px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.5;min-height:100vh}
.hidden{display:none!important}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:360px;box-shadow:var(--shadow)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.auth-logo-icon{width:36px;height:36px;background:var(--yellow);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#000}
.auth-title{font-size:15px;font-weight:700}
.auth-sub{font-size:11px;color:var(--muted)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.form-group input,.form-group select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s;font-family:inherit}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-primary{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:var(--accent-hover)}
.auth-error{font-size:12px;color:var(--red);margin-top:10px;display:none}

/* ── WIZARD (fullscreen = new plan, modal = edit existing) ── */
#wizard-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
#wizard-overlay.fullscreen{background:var(--bg)}
#wizard-overlay.modal-mode{background:rgba(12,26,46,.55);backdrop-filter:blur(4px)}
.wizard-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:580px;box-shadow:0 8px 40px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column}
.wizard-head{padding:20px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.wizard-head-icon{width:32px;height:32px;background:var(--yellow);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#000;flex-shrink:0}
.wizard-head-info{flex:1}
.wizard-head-title{font-size:14px;font-weight:700}
.wizard-head-sub{font-size:11px;color:var(--muted);margin-top:1px}
.wizard-head-close{background:none;border:none;cursor:pointer;font-size:18px;color:var(--faint);padding:4px;border-radius:5px;line-height:1}
.wizard-head-close:hover{color:var(--red);background:var(--red-bg)}
.wizard-progress{padding:16px 28px 0;display:flex;gap:6px}
.wp-step{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background .3s}
.wp-step.done,.wp-step.active{background:var(--accent)}
.wizard-body{padding:20px 28px;overflow-y:auto;max-height:60vh}
.wizard-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:14px 0 8px}
.wizard-section:first-child{margin-top:0}

/* Platform config rows */
.plat-row{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.plat-row.selected{border-color:var(--accent)}
.plat-row-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
.plat-toggle{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;transition:all .15s;position:relative}
.plat-toggle.on{background:var(--accent);border-color:var(--accent)}
.plat-toggle.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.plat-icon{font-size:16px}
.plat-label{font-size:13px;font-weight:600;flex:1}
.plat-label .plat-name{display:block}
.plat-label .plat-status{font-size:10px;font-weight:400;color:var(--faint)}
.plat-config{padding:10px 14px 14px;border-top:1px solid var(--border);background:var(--surface2);display:none}
.plat-row.selected .plat-config{display:block}
/* Account selector */
.acc-select-wrap{display:flex;align-items:center;gap:8px}
.acc-select{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text);background:var(--surface);outline:none;font-family:inherit}
.acc-select:focus{border-color:var(--accent)}
.btn-load-accs{padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.btn-load-accs:hover{border-color:var(--accent);color:var(--accent)}
.btn-test{padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.btn-test:hover{border-color:var(--accent);color:var(--accent)}
.test-result{margin-top:6px;font-size:11px;padding:4px 8px;border-radius:5px}
.test-ok{background:var(--green-bg);color:var(--green)}
.test-fail{background:var(--red-bg);color:var(--red)}
.acc-info{font-size:10px;color:var(--faint);margin-top:4px}

/* Verification row */
.row-verify td{padding:3px 8px 5px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);background:rgba(214,222,35,.06)}
.row-verify{border-left:3px solid #D6DE23}
.rv-badge{display:inline-block;font-size:9px;font-weight:700;color:#5a5c00;text-transform:uppercase;letter-spacing:.06em;background:rgba(214,222,35,.3);padding:1px 5px;border-radius:3px}
.rv-label{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);display:block;margin-bottom:1px}
.rv-val{font-size:12px;font-weight:600;color:var(--text)}
.rv-match{color:var(--text)}
.rv-nomatch{color:var(--faint);font-style:italic}
.rv-ok{color:#155724}.rv-warn{color:#856404}

/* Budget type cards */
.budget-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bt-card{border:2px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.bt-card:hover{border-color:var(--accent)}
.bt-card.selected{border-color:var(--accent);background:var(--accent-bg)}
.bt-card-icon{font-size:18px;margin-bottom:3px}
.bt-card-label{font-size:12px;font-weight:700}
.bt-card-desc{font-size:10px;color:var(--muted);margin-top:2px}

/* Verba toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;cursor:pointer}
.toggle-row-label{font-size:12px;font-weight:600}
.toggle-row-desc{font-size:10px;color:var(--muted)}
.toggle-switch{width:36px;height:20px;border-radius:10px;background:var(--border);position:relative;flex-shrink:0;transition:background .2s}
.toggle-switch.on{background:var(--accent)}
.toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.toggle-switch.on::after{left:19px}
.verba-field-wrap{transition:opacity .2s}
.verba-field-wrap.disabled{opacity:.4;pointer-events:none}
.field-note{font-size:11px;color:var(--muted);background:var(--orange-bg);border:1px solid var(--orange-border);border-radius:6px;padding:6px 10px;margin-top:4px}

/* Wizard footer */
.wizard-foot{padding:14px 28px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface)}
.wizard-step-label{font-size:11px;color:var(--muted)}
.wizard-nav{display:flex;gap:8px}
.wbtn-back{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.wbtn-next{padding:7px 18px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;background:var(--accent);color:#fff}
.wbtn-next:hover{background:var(--accent-hover)}

/* ── APP ── */
#app{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{width:28px;height:28px;background:var(--yellow);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#000;flex-shrink:0}
.topbar-title{font-size:14px;font-weight:700}
.topbar-sub{font-size:11px;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:8px}
.role-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:4px}
.role-editor{background:var(--green-bg);color:var(--green)}
.role-viewer{background:var(--blue-bg);color:var(--blue)}
.btn-icon{font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;padding:5px 8px;border-radius:5px}
.btn-icon:hover{background:var(--surface2)}
.tabs-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:flex-end;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;font-size:12px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.content{padding:20px;flex:1;width:100%}

/* ── BUDGET HEADER ── */
.budget-header{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.budget-grid{display:grid;grid-template-columns:25% 1fr 1fr 34%}
.budget-col{border-right:1px solid var(--border)}
.budget-col:last-child{border-right:none}

/* Col 1 — Identificação */
.bc-id{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.bc-title-row{display:flex;align-items:flex-start;justify-content:space-between}
.project-field{margin-bottom:4px}
.pf-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);display:block;margin-bottom:1px}
.pf-value{font-size:13px;font-weight:700;color:var(--text)}
.bc-divider{border-top:1px solid var(--border);margin:4px 0}
.oc-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0}
.oc-label{font-size:10px;color:var(--muted);font-weight:500}
.oc-value{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.oc-value.libre{font-size:14px;font-weight:800;color:var(--accent)}
.oc-value.deduz{color:var(--muted);text-decoration:line-through;font-weight:500}

/* Col 2 — Previsão Planilha */
.bc-prev{display:flex;flex-direction:column}
.bc-col-title{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:10px 18px 6px;border-bottom:1px solid var(--border)}
.bc-metric-row{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--border);flex:1}
.bc-metric-row:last-child{border-bottom:none}
.bc-metric-label{font-size:11px;color:var(--muted);font-weight:500}
.bc-metric-val{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.bc-alert-row{padding:10px 18px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px}
.bc-alert-row.ok{background:rgba(46,125,50,.06)}
.bc-alert-row.warn{background:#fff3cd}
.bc-alert-row.alert{background:#fff0f0}
.bc-disponivel-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.bc-disponivel-val{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.bc-disponivel-val.ok{color:#2E7D32}
.bc-disponivel-val.alert{color:#c62828}
.bc-alert-msg{font-size:10px;font-weight:700;color:#c62828}

/* Col 3 — Orçamento Disponível */
.bc-sobra{display:flex;flex-direction:column}
.bc-sobra-row{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--border);flex:1}
.bc-sobra-row:last-child{border-bottom:none}
.bc-sobra-label{font-size:11px;color:var(--muted);font-weight:500}
.bc-sobra-val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.bc-sobra-row.total-row{background:rgba(214,222,35,.1)}
.bc-sobra-val.total{font-size:16px;font-weight:800;color:var(--accent)}

/* Col 4 — Planilha vs Fonte */
.bc-compare{display:flex;flex-direction:column}
.cmp-table{width:100%;border-collapse:collapse;flex:1}
.cmp-table thead th{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--border);text-align:right}
.cmp-table thead th:first-child{text-align:left}
.cmp-table tbody td{padding:5px 10px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;vertical-align:middle}
.cmp-table tbody td:first-child{text-align:left}
.cmp-table tfoot td{padding:7px 10px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;border-top:2px solid var(--border)}
.cmp-table tfoot td:first-child{text-align:left}
.cmp-plat-badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px}
.cmp-plat-badge.meta{background:#E8F5E9;color:#2E7D32}
.cmp-plat-badge.linkedin{background:#F3E5F5;color:#6A1B9A}
.cmp-plat-badge.google{background:#FFF3E0;color:#E65100}
.cmp-plat-badge.tiktok{background:#E0F2F1;color:#006064}
.diff-ok{color:#2E7D32}
.diff-under{color:#E65100}
.diff-over{color:#c62828}
.btn-pencil{background:none;border:none;cursor:pointer;color:var(--faint);font-size:13px;padding:2px 6px;border-radius:4px;transition:color .15s,background .15s}
.btn-pencil:hover{color:var(--accent);background:var(--accent-bg)}

/* Config inline edit */
.config-field{margin-bottom:8px}
.config-field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:3px}
.config-input{width:100%;border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:12px;color:var(--text);background:var(--surface);outline:none;font-family:inherit}
.config-input:focus{border-color:var(--accent)}
.config-actions{display:flex;gap:6px;margin-top:8px}
.btn-cfg-save{padding:5px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
.btn-cfg-cancel{padding:5px 12px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}

/* Monthly budget bar */
.mes-budget-bar{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mes-budget-label{font-size:11px;font-weight:600;color:var(--muted)}
.mes-budget-input{border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700;width:110px;text-align:right;outline:none}
.mes-budget-input:focus{border-color:var(--accent)}
.btn-mes-save{padding:5px 12px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}

/* ── SUMMARY ── */
.summary-band{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.summary-card{border-radius:var(--radius);padding:14px 18px;text-align:center;color:#fff}
.summary-card.previsto{background:#2E7D32}
.summary-card.sobra{background:#1B5E20}
.summary-card.anterior{background:#33691E}
.summary-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.85;margin-bottom:4px}
.summary-value{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}

/* ── TABLE ── */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.table-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.table-title{font-size:13px;font-weight:700}
.btn-add{display:flex;align-items:center;gap:5px;padding:6px 12px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.btn-add:hover{opacity:.88}

/* View toolbar */
.view-toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.view-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.view-pill{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);white-space:nowrap}
.view-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.view-pill:hover:not(.active){border-color:var(--accent);color:var(--accent)}
.btn-save-view{margin-left:auto;padding:3px 10px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
thead{background:var(--surface2)}
th{padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--faint);white-space:nowrap;border-bottom:2px solid var(--border);border-right:1px solid var(--border);position:relative}
th:last-child{border-right:none}
th.num{text-align:right}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
td.num strong{color:var(--text);font-weight:700}
.cell-input{width:100%;border:none;background:transparent;font-size:12px;color:var(--text);font-family:inherit;padding:0;outline:none}
.cell-input[readonly]{cursor:default}
.num-input{text-align:right;font-variant-numeric:tabular-nums}
.date-input{width:96px}
.name-input{min-width:200px}
.euro-input{width:68px}
select.status-select,select.plat-select{border:none;background:transparent;font-size:11px;font-weight:700;cursor:pointer;outline:none;border-radius:4px;padding:2px 6px}
select[disabled]{cursor:default;opacity:.7}
.status-ativo{background:var(--green-bg);color:var(--green)}
.status-reprovado{background:var(--red-bg);color:var(--red)}
.status-pausado{background:var(--orange-bg);color:var(--orange)}
.status-aprovacao{background:var(--blue-bg);color:var(--blue)}
.plat-meta{background:#E8F5E9;color:#2E7D32}
.plat-linkedin{background:#F3E5F5;color:#6A1B9A}
.plat-google{background:#FFF3E0;color:#E65100}
.plat-tiktok{background:#E0F2F1;color:#006064}
.btn-del{background:none;border:none;cursor:pointer;color:var(--faint);font-size:16px;padding:2px 6px;border-radius:4px;line-height:1}
.btn-del:hover{color:var(--red);background:var(--red-bg)}

/* Platform blocks */
tr.row-meta td{background:#E8F5E9}
tr.row-linkedin td{background:#F3E5F5}
tr.row-google td{background:#FFF3E0}
tr.row-tiktok td{background:#E0F2F1}
tr.row-meta:hover td{background:#C8E6C9}
tr.row-linkedin:hover td{background:#E1BEE7}
tr.row-google:hover td{background:#FFE0B2}
tr.row-tiktok:hover td{background:#B2DFDB}
.plat-block-header td{padding:6px 10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border)}
.ph-meta td{background:#A5D6A7;color:#1B5E20;border-left:3px solid #43A047}
.ph-linkedin td{background:#CE93D8;color:#4A148C;border-left:3px solid #9C27B0}
.ph-google td{background:#FFCC80;color:#E65100;border-left:3px solid #FB8C00}
.ph-tiktok td{background:#80DEEA;color:#006064;border-left:3px solid #00ACC1}
.plat-subtotal td{padding:7px 10px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;border-top:2px solid var(--border);border-bottom:1px solid var(--border)}
.ps-meta td{background:#C8E6C9;color:#2E7D32}
.ps-linkedin td{background:#E1BEE7;color:#6A1B9A}
.ps-google td{background:#FFE0B2;color:#E65100}
.ps-tiktok td{background:#B2EBF2;color:#00697A}

/* Resize handle */
.col-resize-handle{position:absolute;right:0;top:0;width:6px;height:100%;cursor:col-resize;z-index:10;background:transparent}
.col-resize-handle:hover,.col-resize-handle:active{background:var(--accent);opacity:.7}
tr.drag-over td{border-top:2px solid var(--accent)!important;background:rgba(214,222,35,.12)!important}
tr[draggable="true"]{cursor:grab}
tr[draggable="true"]:active{cursor:grabbing}

/* Save bar */
.save-bar{display:none;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--orange-bg);border-top:1px solid var(--orange-border)}
.save-bar.visible{display:flex}
.save-msg{font-size:12px;color:var(--orange);font-weight:600}
.btn-save{padding:6px 16px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}

/* Live dot */
.live-dot{display:inline-block;width:6px;height:6px;background:#2E7D32;border-radius:50%;animation:blink 2s ease-in-out infinite;margin-right:4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

@media(max-width:1200px){
  .budget-grid{grid-template-columns:25% 1fr 34%}
}
@media(max-width:900px){
  .budget-grid{grid-template-columns:1fr}
  .budget-col,.bc-id{border-right:none;border-bottom:1px solid var(--border)}
  .summary-band{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .plat-config-row{grid-template-columns:1fr;grid-template-rows:auto auto auto}
}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-icon">M</div>
      <div><div class="auth-title">MakeLemonAd</div><div class="auth-sub">Plano de Mídia</div></div>
    </div>
    <div class="form-group"><label>Usuário</label><input type="text" id="login-user" placeholder="usuario" autocomplete="username"></div>
    <div class="form-group"><label>Senha</label><input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-primary" onclick="doLogin()">Entrar</button>
    <div class="auth-error" id="login-error">Credenciais incorretas.</div>
  </div>
</div>

<!-- ══ CONFIRM MODAL ══ -->
<div id="confirm-overlay" class="hidden" style="position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(12,26,46,.55);backdrop-filter:blur(4px)">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 32px;max-width:360px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.25);text-align:center">
    <div style="font-size:24px;margin-bottom:12px">🗑️</div>
    <div style="font-size:15px;font-weight:700;margin-bottom:6px">Remover campanha?</div>
    <div id="confirm-camp-name" style="font-size:12px;color:var(--muted);margin-bottom:22px;font-style:italic"></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button onclick="closeConfirm()" style="padding:9px 20px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:13px;font-weight:600;cursor:pointer">Cancelar</button>
      <button id="confirm-btn-ok" style="padding:9px 20px;border:none;border-radius:8px;background:var(--red,#e53e3e);color:#fff;font-size:13px;font-weight:700;cursor:pointer">Remover</button>
    </div>
  </div>
</div>

<!-- ══ WIZARD OVERLAY ══ -->
<div id="wizard-overlay" class="hidden">
  <div class="wizard-box">
    <div class="wizard-head">
      <div class="wizard-head-icon">M</div>
      <div class="wizard-head-info">
        <div class="wizard-head-title" id="wizard-title">Novo Plano de Mídia</div>
        <div class="wizard-head-sub" id="wizard-sub"></div>
      </div>
      <button class="wizard-head-close hidden" id="wizard-close" onclick="closeWizard()" title="Fechar">✕</button>
    </div>
    <div class="wizard-progress">
      <div class="wp-step" id="wp1"></div>
      <div class="wp-step" id="wp2"></div>
      <div class="wp-step" id="wp3"></div>
    </div>
    <div class="wizard-body" id="wizard-body"></div>
    <div class="wizard-foot">
      <span class="wizard-step-label" id="wizard-foot-label"></span>
      <div class="wizard-nav">
        <button class="wbtn-back hidden" id="wbtn-back" onclick="wizardBack()">← Voltar</button>
        <button class="wbtn-next" id="wbtn-next" onclick="wizardNext()">Continuar →</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">M</div>
      <div>
        <div class="topbar-title" id="topbar-title">Plano de Mídia</div>
        <div class="topbar-sub" id="topbar-sub">MakeLemonAd</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="live-dot" id="rt-dot"></span><span id="rt-label" style="font-size:11px;color:var(--muted)">Report Ninja</span>
      <button class="btn-icon" id="btn-rt-refresh" onclick="refreshRt()" title="Atualizar dados Report Ninja">⟳</button>
      <span class="role-badge" id="role-badge" style="margin-left:8px"></span>
      <button class="btn-icon" id="btn-settings" onclick="openWizardModal()" title="Configurações do plano">⚙️</button>
      <button class="btn-icon" onclick="doLogout()">Sair</button>
    </div>
  </div>
  <div class="tabs-bar" id="tabs-bar"></div>
  <div class="content" id="main-content">
    <div style="padding:40px;text-align:center;color:var(--muted)">A carregar...</div>
  </div>
</div>

<script>
// ══ STATE ══
let currentToken = null, currentRole = null, currentMes = null
let mesData = {}, realtimeData = {}, dirty = false, configEditing = false
let wizardStep = 1, wizardIsModal = false

let cfg = {
  cliente:'', agencia:'', moeda:'EUR',
  plataformas: ['meta','linkedin'],
  plataformas_config: {},
  tipo_orcamento: 'mensal_fixo', // anual | mensal_fixo | mensal_variavel
  orcamento_anual: 0,
  orcamento_mensal_base: 0,
  verba_seguranca: 100,
  verba_seguranca_por_mes: false,
  periodo_inicio: '', periodo_fim: '',
  orcamentos_mensais: {}, verbas_mensais: {}
}

let MESES = []
const NOMES_MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
const PLAT_LABELS = { meta:'Meta Ads', linkedin:'LinkedIn Ads', google:'Google Ads', tiktok:'TikTok Ads' }
const PLAT_ORDER = ['meta', 'google', 'linkedin', 'tiktok']
const PLAT_DEFS = [
  { id:'meta',     icon:'📘', label:'Meta Ads',     placeholder_key:'brunomdois@gmail.com', placeholder_acc:'2364073693796998' },
  { id:'linkedin', icon:'💼', label:'LinkedIn Ads',  placeholder_key:'7YTLMHaQPL',          placeholder_acc:'514458905' },
  { id:'google',   icon:'🟢', label:'Google Ads',    placeholder_key:'connection_key',       placeholder_acc:'account_id' },
  { id:'tiktok',   icon:'🎵', label:'TikTok Ads',    placeholder_key:'connection_key',       placeholder_acc:'account_id' },
]

// ══ UTILS ══
const MOEDA_SYM={EUR:'€',BRL:'R$',USD:'$'}
const MOEDA_LOCALE={EUR:'pt-PT',BRL:'pt-BR',USD:'en-US'}
function moedaSym(){return MOEDA_SYM[cfg.moeda]||'€'}
function fmtEur(v) {
  if (v==null||isNaN(v)) return '—'
  const sym=moedaSym(),loc=MOEDA_LOCALE[cfg.moeda]||'pt-PT'
  return sym+Number(v).toLocaleString(loc,{minimumFractionDigits:2,maximumFractionDigits:2})
}
function fmtPct(v) {
  if (!v||isNaN(v)) return ''
  return Number(v).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'
}
function monthLabel(k) { const [y,m]=k.split('-'); return NOMES_MESES[+m-1].slice(0,3)+' '+y }
function monthLabelFull(k) { const [y,m]=k.split('-'); return NOMES_MESES[+m-1]+' '+y }
function generateMeses(ini,fim) {
  const r=[]; let [y,m]=ini.split('-').map(Number); const [fy,fm]=fim.split('-').map(Number)
  while(y<fy||(y===fy&&m<=fm)){r.push(`${y}-${String(m).padStart(2,'0')}`);m++;if(m>12){m=1;y++}}
  return r
}
function budgetForMes(key) {
  if (cfg.tipo_orcamento==='mensal_variavel') return cfg.orcamentos_mensais[key]??cfg.orcamento_mensal_base
  if (cfg.tipo_orcamento==='anual') return MESES.length>0?cfg.orcamento_anual/MESES.length:cfg.orcamento_mensal_base
  return cfg.orcamento_mensal_base
}
function verbaForMes(key) {
  if (cfg.verba_seguranca_por_mes) return cfg.verbas_mensais[key]??0
  return cfg.verba_seguranca
}

// ══ AUTH ══
async function doLogin() {
  const usuario=document.getElementById('login-user').value.trim()
  const senha=document.getElementById('login-pass').value
  const err=document.getElementById('login-error'); err.style.display='none'
  try {
    const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario,senha})})
    const d=await r.json()
    if(!r.ok){err.style.display='block';return}
    currentToken=d.token; currentRole=d.role
    sessionStorage.setItem('prr_token',d.token); sessionStorage.setItem('prr_role',d.role)
    await initApp()
  } catch{err.style.display='block'}
}
document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})
function doLogout(){
  sessionStorage.removeItem('prr_token');sessionStorage.removeItem('prr_role')
  currentToken=null;currentRole=null
  document.getElementById('app').classList.add('hidden')
  document.getElementById('wizard-overlay').classList.add('hidden')
  document.getElementById('login-screen').style.display='flex'
}

// ══ CONFIG I/O ══
async function loadConfig() {
  try {
    const r=await fetch('/api/data/config',{headers:{'Authorization':`Bearer ${currentToken}`}})
    if(r.ok){const d=await r.json();if(d&&d.cliente!==undefined)Object.assign(cfg,d)}
  } catch{}
}
async function saveConfig() {
  try {
    await fetch('/api/data/config',{method:'PUT',headers:{'Authorization':`Bearer ${currentToken}`,'Content-Type':'application/json'},body:JSON.stringify(cfg)})
  } catch{}
}

// ══ INIT ══
async function initApp() {
  document.getElementById('login-screen').style.display='none'
  await loadConfig()
  if (!cfg.periodo_inicio||!cfg.periodo_fim) {
    openWizardFullscreen()
  } else {
    MESES=generateMeses(cfg.periodo_inicio,cfg.periodo_fim)
    showApp()
  }
}

function showApp() {
  document.getElementById('app').classList.remove('hidden')
  const badge=document.getElementById('role-badge')
  badge.textContent=currentRole==='editor'?'Editor':'Leitura'
  badge.className='role-badge '+(currentRole==='editor'?'role-editor':'role-viewer')
  document.getElementById('topbar-title').textContent=cfg.cliente||'Plano de Mídia'
  document.getElementById('topbar-sub').textContent=cfg.agencia?`${cfg.agencia} · MakeLemonAd`:'MakeLemonAd'
  document.getElementById('btn-settings').style.display=currentRole==='editor'?'':'none'
  buildTabs()
  const saved=sessionStorage.getItem('prr_mes')
  currentMes=(saved&&MESES.includes(saved))?saved:MESES[0]||''
  if(currentMes) selectMes(currentMes)
}

// ══ WIZARD ══
const WIZARD_STEPS = [
  {
    title:'Passo 1 de 3 — Identificação',foot:'Nome do cliente e agência/intermediário',
    render:()=>`
      <div class="wizard-section">Cliente</div>
      <div class="form-group"><label>Nome do cliente</label><input id="w-cliente" value="${cfg.cliente}" placeholder="Ex: PRR — Recuperar Portugal"></div>
      <div class="form-group"><label>Agência / Intermediário (opcional)</label><input id="w-agencia" value="${cfg.agencia}" placeholder="Ex: ON Partners"></div>
      <div class="form-group"><label>Moeda</label><select id="w-moeda" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:13px">
        <option value="EUR" ${(cfg.moeda||'EUR')==='EUR'?'selected':''}>EUR — Euro (€)</option>
        <option value="BRL" ${cfg.moeda==='BRL'?'selected':''}>BRL — Real (R$)</option>
        <option value="USD" ${cfg.moeda==='USD'?'selected':''}>USD — Dólar ($)</option>
      </select></div>
    `
  },
  {
    title:'Passo 2 de 3 — Plataformas',foot:'Seleciona as plataformas e vincula as contas do Report Ninja',
    render:()=>`
      <div class="wizard-section">Plataformas ativas</div>
      ${PLAT_DEFS.map(p=>{
        const sel=cfg.plataformas.includes(p.id)
        const pc=cfg.plataformas_config[p.id]||{}
        return `
        <div class="plat-row ${sel?'selected':''}" id="platrow-${p.id}">
          <div class="plat-row-head" onclick="togglePlatRow('${p.id}')">
            <div class="plat-toggle ${sel?'on':''}"></div>
            <span class="plat-icon">${p.icon}</span>
            <div class="plat-label">
              <span class="plat-name">${p.label}</span>
              <span class="plat-status" id="plat-status-${p.id}">${sel&&pc.connection_key?'Conta vinculada':'Não configurado'}</span>
            </div>
          </div>
          <div class="plat-config">
            <div class="acc-select-wrap">
              <select class="acc-select" id="w-acc-${p.id}" onchange="onAccSelect('${p.id}')">
                ${pc.account_id
                  ? `<option value="${pc.connection_key}|${pc.account_id}" selected>${pc.account_name||pc.account_id}</option>`
                  : `<option value="">— Selecionar conta —</option>`}
              </select>
              <button class="btn-load-accs" onclick="loadAccounts('${p.id}')">⟳ Carregar</button>
              <button class="btn-test" onclick="testPlatConn('${p.id}')">Testar</button>
            </div>
            <div class="acc-info" id="acc-info-${p.id}">${pc.connection_key?`Conta: ${pc.connection_key} · ID: ${pc.account_id}`:''}</div>
            <div id="test-result-${p.id}"></div>
          </div>
        </div>`
      }).join('')}
    `
  },
  {
    title:'Passo 3 de 3 — Período e Orçamento',foot:'Define o período, tipo e valor do orçamento',
    render:()=>`
      <div class="wizard-section">Período do plano</div>
      <div class="form-row">
        <div class="form-group"><label>Mês de início</label><input type="month" id="w-inicio" value="${cfg.periodo_inicio}"></div>
        <div class="form-group"><label>Mês de fim</label><input type="month" id="w-fim" value="${cfg.periodo_fim}"></div>
      </div>
      <div class="wizard-section">Tipo de orçamento</div>
      <div class="budget-type-grid">
        <div class="bt-card ${cfg.tipo_orcamento==='anual'?'selected':''}" onclick="selectTipo('anual',this)">
          <div class="bt-card-icon">📅</div>
          <div class="bt-card-label">Anual</div>
          <div class="bt-card-desc">Valor total ÷ nº meses</div>
        </div>
        <div class="bt-card ${cfg.tipo_orcamento!=='anual'?'selected':''}" onclick="selectTipo('mensal_variavel',this)">
          <div class="bt-card-icon">📊</div>
          <div class="bt-card-label">Mensal</div>
          <div class="bt-card-desc">Define o valor em cada aba do mês</div>
        </div>
      </div>
      <div id="orcamento-wrap">
        ${renderOrcFields()}
      </div>
      <div class="wizard-section">Verba de segurança</div>
      <div class="toggle-row" onclick="toggleVerba()">
        <div>
          <div class="toggle-row-label">Definir verba de segurança por mês</div>
          <div class="toggle-row-desc">Quando ativo, configuras a verba na aba de cada mês</div>
        </div>
        <div class="toggle-switch ${cfg.verba_seguranca_por_mes?'on':''}" id="verba-toggle"></div>
      </div>
      <div class="verba-field-wrap ${cfg.verba_seguranca_por_mes?'disabled':''}" id="verba-wrap">
        <div class="form-group"><label>Verba de segurança fixa (€/mês)</label><input type="number" id="w-seguranca" value="${cfg.verba_seguranca||100}" step="0.01" min="0"></div>
      </div>
    `
  }
]

function renderOrcFields() {
  if (cfg.tipo_orcamento==='anual') {
    return `<div class="form-group"><label>Orçamento total anual (€)</label><input type="number" id="w-orcamento" value="${cfg.orcamento_anual||''}" step="0.01" placeholder="Ex: 51000"></div>`
  }
  return `
    <div class="form-group" style="opacity:.5;pointer-events:none">
      <label>Orçamento mensal (€)</label>
      <input type="number" disabled placeholder="Definido na aba de cada mês" style="background:var(--surface2)">
    </div>
    <div class="field-note">💡 O valor de cada mês é configurado diretamente na aba do mês, na dashboard.</div>
  `
}

function selectTipo(tipo, el) {
  cfg.tipo_orcamento = tipo
  document.querySelectorAll('.bt-card').forEach(c=>c.classList.remove('selected'))
  el.classList.add('selected')
  document.getElementById('orcamento-wrap').innerHTML = renderOrcFields()
}

function toggleVerba() {
  cfg.verba_seguranca_por_mes = !cfg.verba_seguranca_por_mes
  const t=document.getElementById('verba-toggle'); if(t) t.className='toggle-switch '+(cfg.verba_seguranca_por_mes?'on':'')
  const w=document.getElementById('verba-wrap'); if(w) w.className='verba-field-wrap '+(cfg.verba_seguranca_por_mes?'disabled':'')
}

function togglePlatRow(id) {
  const row=document.getElementById('platrow-'+id)
  const toggle=row.querySelector('.plat-toggle')
  const idx=cfg.plataformas.indexOf(id)
  if(idx===-1){cfg.plataformas.push(id);row.classList.add('selected');toggle.classList.add('on')}
  else{cfg.plataformas.splice(idx,1);row.classList.remove('selected');toggle.classList.remove('on')}
}

async function loadAccounts(id) {
  const sel=document.getElementById('w-acc-'+id)
  const btn=document.querySelector(`[onclick="loadAccounts('${id}')"]`)
  if(btn){btn.textContent='...';btn.disabled=true}
  try {
    const r=await fetch(`/api/connections?platform=${id}`,{headers:{'Authorization':`Bearer ${currentToken}`}})
    const d=await r.json()
    if(d.error&&!d.accounts?.length){
      const res=document.getElementById('test-result-'+id)
      if(res)res.innerHTML=`<div class="test-result test-fail">❌ ${d.error}</div>`
      return
    }
    const pc=cfg.plataformas_config[id]||{}
    const currentVal=pc.connection_key&&pc.account_id?`${pc.connection_key}|${pc.account_id}`:''
    sel.innerHTML=`<option value="">— Selecionar conta —</option>`+
      d.accounts.map(a=>`<option value="${a.connection_key}|${a.account_id}" ${currentVal===`${a.connection_key}|${a.account_id}`?'selected':''}>${a.label}</option>`).join('')
    if(currentVal) onAccSelect(id)
  } catch(e){
    const res=document.getElementById('test-result-'+id)
    if(res)res.innerHTML=`<div class="test-result test-fail">❌ ${e.message}</div>`
  }
  if(btn){btn.textContent='⟳ Carregar';btn.disabled=false}
}

function onAccSelect(id) {
  const sel=document.getElementById('w-acc-'+id)
  const val=sel?.value||''
  const info=document.getElementById('acc-info-'+id)
  const status=document.getElementById('plat-status-'+id)
  if(!val){
    if(info)info.textContent=''
    if(status)status.textContent='Não configurado'
    delete cfg.plataformas_config[id]
    return
  }
  const [ck,ai]=val.split('|')
  const label=sel.options[sel.selectedIndex]?.text||ai
  if(!cfg.plataformas_config)cfg.plataformas_config={}
  cfg.plataformas_config[id]={connection_key:ck,account_id:ai,account_name:label}
  if(info)info.textContent=`Conta: ${ck} · ID: ${ai}`
  if(status)status.textContent='Conta vinculada'
}

async function testPlatConn(id) {
  const pc=cfg.plataformas_config[id]||{}
  const ck=pc.connection_key; const ai=pc.account_id
  const btn=document.querySelector(`[onclick="testPlatConn('${id}')"]`)
  const res=document.getElementById('test-result-'+id)
  if(!ck||!ai){if(res)res.innerHTML='<div class="test-result test-fail">Seleciona uma conta primeiro.</div>';return}
  if(btn){btn.textContent='...';btn.disabled=true}
  try {
    const r=await fetch(`/api/test-platform?platform=${id}&connection_key=${encodeURIComponent(ck)}&account_id=${encodeURIComponent(ai)}`,{headers:{'Authorization':`Bearer ${currentToken}`}})
    const d=await r.json()
    if(res)res.innerHTML=`<div class="test-result ${d.ok?'test-ok':'test-fail'}">${d.ok?'✅':'❌'} ${d.message||d.error}</div>`
  } catch(e){
    if(res)res.innerHTML=`<div class="test-result test-fail">❌ ${e.message}</div>`
  }
  if(btn){btn.textContent='Testar';btn.disabled=false}
}

function renderWizardStep() {
  const s=WIZARD_STEPS[wizardStep-1]
  document.getElementById('wizard-sub').textContent=s.title
  document.getElementById('wizard-foot-label').textContent=s.foot
  document.getElementById('wizard-body').innerHTML=s.render()
  document.querySelectorAll('.wp-step').forEach((el,i)=>{
    el.classList.toggle('done',i<wizardStep-1)
    el.classList.toggle('active',i===wizardStep-1)
  })
  document.getElementById('wbtn-back').classList.toggle('hidden',wizardStep===1&&!wizardIsModal)

  }

  }

  if(wizardStep===1&&wizardIsModal){closeWizard();return}
  if(wizardStep>1){wizardStep--;renderWizardStep()}
}

async function wizardNext() {
  if(wizardStep===1) {
    const c=document.getElementById('w-cliente')?.value.trim()
    if(!c){alert('Indica o nome do cliente.');return}
    cfg.cliente=c; cfg.agencia=document.getElementById('w-agencia')?.value.trim()||''
    cfg.moeda=document.getElementById('w-moeda')?.value||'EUR'
    wizardStep=2; renderWizardStep()
  } else if(wizardStep===2) {
    // plataformas_config already updated live via onAccSelect — just advance
    wizardStep=3; renderWizardStep()
  } else if(wizardStep===3) {
    const ini=document.getElementById('w-inicio')?.value
    const fim=document.getElementById('w-fim')?.value
    if(!ini||!fim||ini>fim){alert('Indica um período válido.');return}
    cfg.periodo_inicio=ini; cfg.periodo_fim=fim
    const orc=parseFloat(document.getElementById('w-orcamento')?.value)||0

    if(currentRole==='editor') await saveConfig()

async function loadRealtime(key) {
  setRtStatus('loading')
  try{
    const [y,m]=key.split('-')
    const ld=new Date(+y,+m,0).getDate()
    const end=`${y}-${m}-${String(ld).padStart(2,'0')}`
    const r=await fetch(`/api/realtime?start=${y}-${m}-01&end=${end}`,{headers:{'Authorization':`Bearer ${currentToken}`}})
    const data=r.ok?await r.json():null
    realtimeData[key]=data&&!data.error?data:{}
    const hasData=data&&Object.keys(data).some(p=>data[p]?.data?.rows?.length||data[p]?.rows?.length)
    setRtStatus(hasData?'ok':data?.error?'error':'empty')
  }catch{realtimeData[key]={};setRtStatus('error')}

// ══ CALC ══
function calcCampanhas(campanhas) {
  const valorMes=budgetForMes(currentMes)
  const verba=verbaForMes(currentMes)
  const orcamento_mes=valorMes-verba
  let totalPrevisto=0
  campanhas.forEach(c=>{
    // Migration: data antiga tem inicio+fim mas não tem dias → calcular
    if(!c.dias&&c.inicio&&c.fim){
      const d=(new Date(c.fim)-new Date(c.inicio))/86400000
      c.dias=d>=0?Math.round(d)+1:0
    }
    // Derivar fim a partir de inicio + dias
    if(c.inicio&&c.dias){
      const s=new Date(c.inicio)
      s.setDate(s.getDate()+(parseInt(c.dias)||0)-1)
      c.fim=s.toISOString().slice(0,10)
    }
    c.total=(parseInt(c.dias)||0)*(parseFloat(c.euro_dia)||0)
    if(c.status==='ativo') totalPrevisto+=c.total
  })
  campanhas.forEach(c=>{c.pct=(c.status==='ativo'&&totalPrevisto>0)?(c.total/totalPrevisto*100):0})
  return{totalPrevisto,orcamento_mes,valorMes,verba}
}

function getSobraAnterior() {
  const idx=MESES.indexOf(currentMes); if(idx<=0) return 0
  const prev=MESES[idx-1]; const pd=mesData[prev]; if(!pd?.campanhas) return 0
  const saveMes=currentMes; currentMes=prev
  const{totalPrevisto,orcamento_mes}=calcCampanhas(pd.campanhas)
  currentMes=saveMes
  return Math.max(0,orcamento_mes-totalPrevisto)
}

function getRtTotals(key) {
  const rd=realtimeData[key]||{}
  let meta=0,linkedin=0,google=0,tiktok=0
  const metaRows=rd.meta?.data?.rows||rd.meta?.rows||[]
  metaRows.forEach(r=>meta+=r.spend||0)
  const liRows=rd.linkedin?.data?.rows||rd.linkedin?.rows||[]
  liRows.forEach(r=>linkedin+=r.costInLocalCurrency||0)
  const gRows=rd.google?.data?.rows||rd.google?.rows||[]
  gRows.forEach(r=>google+=(r['metrics.cost_micros']||0)/1e6)
  const ttRows=rd.tiktok?.data?.rows||rd.tiktok?.rows||[]
  ttRows.forEach(r=>tiktok+=r.spend||0)
  return{meta,linkedin,google,tiktok}
}

// ══ TABLE ROWS ══
const PLAT_BRAND={meta:'#43A047',linkedin:'#9C27B0',google:'#FB8C00',tiktok:'#00ACC1'}

function getRtStatus(plat,r){
  let raw=''
  if(plat==='meta') raw=(r.effective_status||'').toUpperCase()
  else if(plat==='linkedin') raw=(r.campaignStatus||r.status||'').toUpperCase()
  else if(plat==='google') raw=(r['campaign.status']||'').toUpperCase()
  else if(plat==='tiktok') raw=(r.campaign_status||'').toUpperCase()
  if(!raw) return null
  if(raw.includes('ACTIVE')||raw==='ENABLED'||raw.includes('ENABLE')) return 'ativo'
  if(raw.includes('PAUSE')) return 'pausado'
  if(raw.includes('COMPLET')||raw.includes('ENDED')||raw.includes('FINISH')) return 'encerrado'
  if(raw.includes('DELETE')||raw.includes('REMOV')||raw.includes('ARCHIV')) return 'arquivado'
  return raw.toLowerCase()
}

function getRtCampName(plat,r){
  if(plat==='meta') return r.campaign_name||''
  if(plat==='linkedin') return r.campaignName||''
  if(plat==='google') return r['campaign.name']||''
  return r.campaign_name||''
}
function getRtSpend(plat,r){
  if(plat==='meta') return r.spend||0
  if(plat==='linkedin') return r.costInLocalCurrency||0
  if(plat==='google') return (r['metrics.cost_micros']||0)/1e6
  return r.spend||0
}
function getRtDailyBudget(plat,r){
  if(plat==='meta') return parseFloat(r.daily_budget)||0
  if(plat==='google') return (r['campaign_budget.amount_micros']||0)/1e6
  return 0
}
function getRtStartDate(plat,r){
  // start_time now comes from Meta Graph API (injected by realtime.js)
  if(plat==='meta') return r.start_time?r.start_time.slice(0,10):''
  if(plat==='google'){const v=r['campaign.start_date_time']||'';return v?v.slice(0,10):''}
  return ''
}
function getRtEndDate(plat,r){
  // stop_time now comes from Meta Graph API (injected by realtime.js)
  if(plat==='meta') return r.stop_time?r.stop_time.slice(0,10):''
  if(plat==='google'){const v=r['campaign.end_date_time']||'';return v&&!v.startsWith('2037')?v.slice(0,10):''}
  return ''
}
function findRtCampaign(plat,nome){
  const rd=realtimeData[currentMes]
  if(!rd||!rd[plat]) return null
  const rows=(rd[plat].data?.rows)||(rd[plat].rows)||[]
  const norm=s=>(s||'').toLowerCase().replace(/\s+/g,' ').trim()
  // Remove trailing date-like suffix: " - 11/08/2026", " - 2026-08-11", " — cópia" etc.
  const stripDate=s=>s.replace(/[\s\-–—]+(\d{2}[\/\-]\d{2}[\/\-]\d{4}|\d{4}[\/\-]\d{2}[\/\-]\d{2}).*$/i,'').trim()
  const pn=norm(nome)
  if(!pn) return null
  // 1. Exact
  let hit=rows.find(r=>norm(getRtCampName(plat,r))===pn)
  // 2. Substring
  if(!hit) hit=rows.find(r=>{const rn=norm(getRtCampName(plat,r));return rn&&(rn.includes(pn)||pn.includes(rn))})
  // 3. Match without trailing date on both sides
  if(!hit){
    const pnd=stripDate(pn)
    if(pnd.length>=6) hit=rows.find(r=>{const rnd=stripDate(norm(getRtCampName(plat,r)));return rnd.length>=6&&(rnd===pnd||rnd.includes(pnd)||pnd.includes(rnd))})
  }
  return hit||null
}
function renderVerifyRow(plat,campNome,plannedDaily,cols){
  const brand=PLAT_BRAND[plat]||'#D6DE23'
  const vr=document.createElement('tr'); vr.className='row-verify'
  vr.style.borderLeft=`3px solid ${brand}`
  const rd=realtimeData[currentMes]
  if(!rd){
    vr.innerHTML=`<td><span class="rv-badge" style="background:${brand}22;color:${brand}">Fonte</span></td><td colspan="${cols-1}" style="color:var(--faint);font-style:italic">Dados em tempo real não carregados</td>`
    return vr
  }
  if(!rd[plat]){
    vr.innerHTML=`<td><span class="rv-badge" style="background:${brand}22;color:${brand}">Fonte</span></td><td colspan="${cols-1}" style="color:var(--faint);font-style:italic">Plataforma sem dados disponíveis</td>`
    return vr
  }
  const platRows=(rd[plat].data?.rows)||(rd[plat].rows)||[]
  if(platRows.length===0){
    const errMsg=rd[plat]._error
    vr.innerHTML=`<td><span class="rv-badge" style="background:${brand}22;color:${brand}">Fonte</span></td><td colspan="${cols-1}" style="color:var(--faint);font-style:italic">${errMsg?`Erro da fonte: ${errMsg}`:'Sem campanhas no período'}</td>`
    return vr
  }
  const match=findRtCampaign(plat,campNome)
  const today=new Date().toISOString().slice(0,10)
  const fmtD=s=>s?s.slice(0,10).split('-').reverse().join('/'):'—'
  const fmtV=v=>(v!=null&&!isNaN(v)&&v>0)?fmtEur(v):'—'

  const startDate=match?getRtStartDate(plat,match):''
  const endDate=match?getRtEndDate(plat,match):''
  const spend=match?getRtSpend(plat,match):null
  const budget=match?getRtDailyBudget(plat,match):null
  const status=match?getRtStatus(plat,match):null

  let diasAtivos='—'
  if(startDate){
    const refEnd=endDate&&endDate<today?endDate:today
    const ms=new Date(refEnd)-new Date(startDate)
    diasAtivos=Math.max(1,Math.round(ms/86400000)+1)
  }

  const nomeCell=match
    ?`<span class="rv-match">${getRtCampName(plat,match)}</span>`
    :`<span class="rv-nomatch">${campNome?'Não encontrada na fonte':'Sem nome para busca'}</span>`

  const STATUS_PILL={
    ativo:`<span style="display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#d4edda;color:#155724">● ATIVO</span>`,
    pausado:`<span style="display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#fff3cd;color:#856404">⏸ PAUSADO</span>`,
    encerrado:`<span style="display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#f8d7da;color:#721c24">■ ENCERRADO</span>`,
    arquivado:`<span style="display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#e2e3e5;color:#383d41">▪ ARQUIVADO</span>`,
  }
  const statusPill=status?(STATUS_PILL[status]||`<span style="font-size:9px;color:var(--muted)">${status}</span>`):`<span style="color:var(--faint)">—</span>`

  // Budget match check: within 5% of planned daily
  let budgetCheck=''
  if(budget!=null&&budget>0&&plannedDaily>0){
    const diff=Math.abs(budget-plannedDaily)/plannedDaily
    if(diff<=0.05) budgetCheck=`<span style="color:#155724;font-size:12px;font-weight:800" title="Orçamento diário confirmado na fonte">✔</span> `
    else budgetCheck=`<span style="color:#856404;font-size:11px" title="Orçamento diverge do plano (plano: ${fmtEur(plannedDaily)} / fonte: ${fmtEur(budget)})">⚠</span> `
  }

  const badge=`<span class="rv-badge" style="background:${brand}22;color:${brand}">Fonte</span>`

  vr.innerHTML=`
    <td>${badge}<br>${statusPill}</td>
    <td><span class="rv-label">Início</span><span class="rv-val">${fmtD(startDate)}</span></td>
    <td><span class="rv-label">Final</span><span class="rv-val">${fmtD(endDate)}</span></td>
    <td></td>
    <td>${nomeCell}</td>
    <td class="num"><span class="rv-label">Dias</span><span class="rv-val">${diasAtivos}</span></td>
    <td class="num"><span class="rv-label">${moedaSym()}/dia</span><span class="rv-val">${budgetCheck}${fmtV(budget)}</span></td>
    <td class="num"><span class="rv-label">Gasto</span><span class="rv-val ${match?(spend>0?'rv-ok':'rv-warn'):'rv-nomatch'}">${match?fmtV(spend):'—'}</span></td>
    <td></td><td></td>${cols>10?'<td></td>':''}
  `
  return vr
}

function renderRows(campanhas,isEditor){
  const tbody=document.getElementById('camp-tbody'); if(!tbody)return
  tbody.innerHTML=''
  const cols=isEditor?11:10
  const activePlats=PLAT_ORDER.filter(p=>cfg.plataformas.includes(p))
  const groups={}; activePlats.forEach(p=>{groups[p]=[]})
  campanhas.forEach((c,i)=>{const p=c.plataforma||activePlats[0]||'meta';if(!groups[p])groups[p]=[];groups[p].push({c,i})})
  activePlats.forEach(plat=>{
    const items=groups[plat]; if(!items||items.length===0)return
    const htr=document.createElement('tr'); htr.className=`plat-block-header ph-${plat}`
    htr.innerHTML=`<td colspan="${cols}">${PLAT_LABELS[plat]||plat}</td>`; tbody.appendChild(htr)
    let platTotal=0
    items.forEach(({c,i})=>{
      platTotal+=c.total||0
      const tr=document.createElement('tr'); tr.className='row-'+plat
      if(isEditor){tr.draggable=true;tr.ondragstart=e=>onRowDragStart(e,i,plat);tr.ondragend=e=>onRowDragEnd(e);tr.ondragover=e=>onRowDragOver(e,i,plat);tr.ondrop=e=>onRowDrop(e,i,plat)}
      const platOpts=activePlats.map(p=>`<option value="${p}" ${(c.plataforma||activePlats[0])===p?'selected':''}>${PLAT_LABELS[p]?.split(' ')[0]||p}</option>`).join('')
      tr.innerHTML=`
        <td><select class="plat-select plat-${c.plataforma||'meta'}" data-idx="${i}" data-field="plataforma" onchange="onStatusChange(this)" ${!isEditor?'disabled':''}>${platOpts}</select></td>
        <td><input class="cell-input date-input" type="date" value="${c.inicio||''}" ${!isEditor?'readonly':''} data-idx="${i}" data-field="inicio" onchange="onCellChange(this)"></td>
        <td style="color:var(--muted);font-size:12px;white-space:nowrap">${c.fim?c.fim.split('-').reverse().join('/'):'—'}</td>
        <td><input class="cell-input date-input" type="date" value="${c.ultima_atualizacao||''}" ${!isEditor?'readonly':''} data-idx="${i}" data-field="ultima_atualizacao" onchange="onCellChange(this)"></td>
        <td><input class="cell-input name-input" type="text" value="${c.nome||''}" placeholder="Nome da campanha" ${!isEditor?'readonly':''} data-idx="${i}" data-field="nome" onchange="onCellChange(this)"></td>
        <td class="num">${isEditor?`<input class="cell-input num-input" type="number" min="1" step="1" value="${c.dias||''}" placeholder="Dias" data-idx="${i}" data-field="dias" onchange="onCellChange(this)">`:`<strong>${c.dias||0}</strong>`}</td>
        <td class="num">${isEditor?`<span style="display:inline-flex;align-items:center;gap:2px"><span style="color:var(--muted);font-size:11px;font-weight:600">${moedaSym()}</span><input class="cell-input num-input euro-input" type="number" step="0.01" min="0" value="${c.euro_dia||''}" placeholder="0,00" data-idx="${i}" data-field="euro_dia" onchange="onCellChange(this)"></span>`:`<strong>${c.euro_dia?fmtEur(parseFloat(c.euro_dia)):'—'}</strong>`}</td>
        <td class="num"><strong>${fmtEur(c.total)}</strong></td>
        <td class="num">${c.status==='ativo'?fmtPct(c.pct):''}</td>
        <td><select class="status-select status-${c.status||''}" data-idx="${i}" data-field="status" onchange="onStatusChange(this)" ${!isEditor?'disabled':''}>
          <option value="" ${!c.status?'selected':''}>—</option>
          <option value="ativo" ${c.status==='ativo'?'selected':''}>ATIVO</option>
          <option value="reprovado" ${c.status==='reprovado'?'selected':''}>REPROVADO</option>
          <option value="pausado" ${c.status==='pausado'?'selected':''}>PAUSADO</option>
          <option value="aprovacao" ${c.status==='aprovacao'?'selected':''}>EM APROVAÇÃO</option>
        </select></td>
        ${isEditor?`<td><button class="btn-del" onclick="delCampanha(${i})" title="Remover">×</button></td>`:''}
      `
      tbody.appendChild(tr)
      tbody.appendChild(renderVerifyRow(plat, c.nome||'', parseFloat(c.euro_dia)||0, cols))
    })
    const str=document.createElement('tr'); str.className=`plat-subtotal ps-${plat}`
    str.innerHTML=`<td colspan="7" style="text-align:right;padding-right:12px">Total ${PLAT_LABELS[plat]||plat}</td><td class="num">${fmtEur(platTotal)}</td><td colspan="${isEditor?3:2}"></td>`
    tbody.appendChild(str)
  })
}

function onCellChange(el){
  const idx=+el.dataset.idx,field=el.dataset.field
  mesData[currentMes].campanhas[idx][field]=el.value
  calcCampanhas(mesData[currentMes].campanhas)
  markDirty();renderContent()
}
function onStatusChange(el){
  const idx=+el.dataset.idx,field=el.dataset.field
  mesData[currentMes].campanhas[idx][field]=el.value
  if(field==='status')el.className=`status-select status-${el.value}`
  if(field==='plataforma')el.className=`plat-select plat-${el.value}`
  markDirty();renderContent()
}
function addCampanha(){
  if(!mesData[currentMes])mesData[currentMes]={campanhas:[]}
  const p=cfg.plataformas?.[0]||'meta'
  mesData[currentMes].campanhas.push({plataforma:p,nome:'',inicio:'',fim:'',euro_dia:'',status:'ativo'})
  markDirty();renderContent()
}
function delCampanha(idx){
  const camp=mesData[currentMes].campanhas[idx]
  document.getElementById('confirm-camp-name').textContent=camp?.nome||'(sem nome)'
  document.getElementById('confirm-overlay').classList.remove('hidden')
  document.getElementById('confirm-btn-ok').onclick=()=>{
    closeConfirm()
    mesData[currentMes].campanhas.splice(idx,1)
    markDirty();renderContent()
  }
}
function closeConfirm(){
  document.getElementById('confirm-overlay').classList.add('hidden')
  document.getElementById('confirm-btn-ok').onclick=null
}

// ── drag-and-drop reorder ──
let _dragIdx=null,_dragPlat=null
function onRowDragStart(e,idx,plat){
  _dragIdx=idx;_dragPlat=plat
  e.dataTransfer.effectAllowed='move'
  e.currentTarget.style.opacity='.4'
}
function onRowDragEnd(e){
  e.currentTarget.style.opacity=''
  document.querySelectorAll('tr.drag-over').forEach(r=>r.classList.remove('drag-over'))
}
function onRowDragOver(e,idx,plat){
  if(_dragIdx===null||plat!==_dragPlat||idx===_dragIdx)return
  e.preventDefault(); e.dataTransfer.dropEffect='move'
  document.querySelectorAll('tr.drag-over').forEach(r=>r.classList.remove('drag-over'))
  e.currentTarget.classList.add('drag-over')
}
function onRowDrop(e,dropIdx,plat){
  e.preventDefault()
  document.querySelectorAll('tr.drag-over').forEach(r=>r.classList.remove('drag-over'))
  if(_dragIdx===null||plat!==_dragPlat||dropIdx===_dragIdx){_dragIdx=null;return}
  const arr=mesData[currentMes].campanhas
  const [moved]=arr.splice(_dragIdx,1)
  arr.splice(dropIdx,0,moved)
  _dragIdx=null;markDirty();renderContent()
}
function markDirty(){
  dirty=true
  const bar=document.getElementById('save-bar'); if(bar)bar.classList.add('visible')
}
async function saveData(){
  try{
    const r=await fetch(`/api/data/${currentMes}`,{method:'PUT',headers:{'Authorization':`Bearer ${currentToken}`,'Content-Type':'application/json'},body:JSON.stringify(mesData[currentMes])})
    if(r.ok){dirty=false;const bar=document.getElementById('save-bar');if(bar)bar.classList.remove('visible')}
    else alert('Erro ao guardar.')
  }catch{alert('Sem ligação.')}
}

// ══ VIEWS + RESIZE ══
const DEFAULT_COL_WIDTHS=[110,90,90,100,280,50,70,90,50,110,36]
let colWidths=[...DEFAULT_COL_WIDTHS]
function viewKey(){return `prr_view_${cfg.cliente||'default'}`}
function saveView(name){const v=JSON.parse(localStorage.getItem(viewKey())||'{}');v[name]={colWidths:[...colWidths]};localStorage.setItem(viewKey(),JSON.stringify(v));renderViewBar()}
function loadView(name){const v=JSON.parse(localStorage.getItem(viewKey())||'{}');if(v[name]){colWidths=[...v[name].colWidths];applyColWidths();renderViewBar(name)}}
function listViews(){return Object.keys(JSON.parse(localStorage.getItem(viewKey())||'{}'))}
function applyColWidths(){const cg=document.getElementById('camp-colgroup');if(!cg)return;cg.querySelectorAll('col').forEach((c,i)=>{if(colWidths[i])c.style.width=colWidths[i]+'px'})}
function resetColWidths(){colWidths=[...DEFAULT_COL_WIDTHS];applyColWidths();renderViewBar()}
function promptSaveView(){const n=prompt('Nome para esta visualização:');if(n&&n.trim())saveView(n.trim())}
function renderViewBar(activeView){
  const bar=document.getElementById('view-toolbar');if(!bar)return
  const isEditor=currentRole==='editor'
  bar.innerHTML=`
    <span class="view-label">Visualização:</span>
    <div class="view-pill ${!activeView?'active':''}" onclick="resetColWidths()">Padrão</div>
    ${listViews().map(v=>`<div class="view-pill ${activeView===v?'active':''}" onclick="loadView('${v}')">${v}</div>`).join('')}
    ${isEditor?`<button class="btn-save-view" onclick="promptSaveView()">+ Salvar Vista</button>`:''}
  `
}
function initColResize(){
  const table=document.getElementById('camp-table');if(!table)return
  table.querySelectorAll('thead th').forEach((th,idx)=>{
    const h=document.createElement('div');h.className='col-resize-handle';th.appendChild(h)
    let startX,startW
    h.addEventListener('mousedown',e=>{
      startX=e.clientX;startW=colWidths[idx]
      document.body.style.cursor='col-resize';document.body.style.userSelect='none'
      const mv=e=>{colWidths[idx]=Math.max(40,startW+(e.clientX-startX));applyColWidths()}
      const up=()=>{document.body.style.cursor='';document.body.style.userSelect='';document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)}
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)
      e.preventDefault()
    })
  })
  applyColWidths();renderViewBar()
}

// ══ BOOT ══
;(async()=>{
  const t=sessionStorage.getItem('prr_token'),role=sessionStorage.getItem('prr_role')
  if(t&&role){currentToken=t;currentRole=role;await initApp()}
})()
</script>
