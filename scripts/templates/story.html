<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
<style>
  :root {
    --lime: #D6DE23;
    --green2: #00A652;
    --dark-green: #006838;
    --black: #000000;
    --text-dark: #434244;
    --white: #FFFFFF;
    --bg-white: #DEDEDE;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;
    height: 1920px;
    font-family: 'Rubik', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .slide {
    position: relative;
    width: 1080px;
    height: 1920px;
    padding: 70px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }

  /* Backgrounds */
  .bg-black       { background: var(--black);       color: var(--white); }
  .bg-dark-gray   { background: var(--text-dark);   color: var(--white); }
  .bg-light-gray  { background: var(--bg-white);    color: var(--text-dark); }
  .bg-lime        { background: var(--lime);        color: var(--text-dark); }
  .bg-green2      { background: var(--green2);      color: var(--white); }
  .bg-split-hv    { background: linear-gradient(to bottom, var(--lime)  50%, var(--black) 50%); color: var(--white); }
  .bg-split-hv-inv{ background: linear-gradient(to bottom, var(--black) 50%, var(--lime)  50%); color: var(--white); }

  /* Hashtag topo-esquerdo */
  .hashtag {
    position: absolute;
    top: 70px;
    left: 70px;
    font-size: 16px;
    font-weight: 300;
    font-style: italic;
    z-index: 5;
    letter-spacing: 0;
    line-height: 1;
  }
  .hashtag strong { font-weight: 500; font-style: italic; }

  /* Numeração (canto superior esquerdo) */
  .slide-num {
    position: absolute;
    top: 70px;
    left: 70px;
    border: 1.2px solid currentColor;
    padding: 4px 14px;
    font-size: 16px;
    font-weight: 400;
    font-style: italic;
    min-width: 44px;
    text-align: center;
    z-index: 5;
  }

  /* Selo Make topo-direito */
  .logo-top {
    position: absolute;
    top: 70px;
    right: 70px;
    width: 90px;
    height: 90px;
    z-index: 5;
  }
  .logo-top img { width: 100%; height: 100%; object-fit: contain; }

  /* Rodapé */
  .footer {
    position: absolute;
    bottom: 70px;
    left: 70px;
    right: 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    z-index: 5;
    font-weight: 400;
  }
  .footer .handle { font-style: italic; font-weight: 500; }
  .footer .signature { font-weight: 400; font-style: normal; }
  .footer .signature em { font-weight: 600; font-style: italic; }

  /* Conteúdo central */
  .content {
    position: relative;
    z-index: 2;
    width: 100%;
  }

  /* Story CTA: layout absoluto centralizado */
  .has-cta .content {
    position: absolute;
    top: 70px;
    bottom: 70px;
    left: 70px;
    right: 70px;
    width: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 56px;
    z-index: 3;
  }

  /* Imagem full-bleed */
  .fullbleed-image-area {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover;
    background-position: center;
    z-index: 1;
  }
  .fullbleed-image-area::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.15) 18%,
        rgba(0,0,0,0.10) 55%,
        rgba(0,0,0,0.85) 100%);
    pointer-events: none;
  }
  .has-fullbleed .content {
    position: absolute;
    top: 70px; left: 70px; right: 70px; bottom: 220px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    z-index: 3;
  }

  /* Helpers tipográficos */
  .h1 { font-size: 120px; font-weight: 700; line-height: 0.98; letter-spacing: -3px; }
  .h2 { font-size: 88px;  font-weight: 700; line-height: 1.0;  letter-spacing: -2px; }
  .h3 { font-size: 64px;  font-weight: 700; line-height: 1.05; letter-spacing: -1px; }
  .body-lg { font-size: 34px; font-weight: 400; line-height: 1.3; }
  .body-md { font-size: 26px; font-weight: 400; line-height: 1.35; }
  .italic  { font-style: italic; }
  .bold    { font-weight: 700; }
  .medium  { font-weight: 500; }
  .regular { font-weight: 400; }
  .lime    { color: var(--lime); }
  .green2  { color: var(--green2); }
  .white   { color: var(--white); }
  .black   { color: var(--black); }
  .dark    { color: var(--text-dark); }
  .muted   { opacity: 0.55; }
  .outline-text { -webkit-text-stroke: 2px currentColor; color: transparent; }

  /* Swipe up indicator */
  .swipe-up {
    position: absolute;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 5;
    opacity: 0.75;
  }
  .swipe-up svg { display: block; }
  .swipe-up span {
    font-size: 18px;
    font-weight: 500;
    font-style: italic;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide {{BG_CLASS}}">
    {{COVER_IMAGE}}
    {{TOP_LEFT}}
    {{TOP_RIGHT}}
    <div class="content">
      {{CONTENT}}
    </div>
    {{SWIPE_UP}}
    {{FOOTER}}
  </div>
</body>
</html>
