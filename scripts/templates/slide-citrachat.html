<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pulse:       #C8FF2E;
    --pulse-dark:  #2F6B10;
    --warmth:      #E05C3E;
    --clarity:     #3E88D4;
    --ember:       #E8A040;
    --void:        #13111E;
    --cream:       #F8F4EB;
    --ink:         #13111E;
    --white:       #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .slide {
    position: relative;
    width: 1080px;
    height: 1350px;
    /* Grade CitraChat: 90px em todos os lados */
    padding: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }

  /* Backgrounds */
  .bg-void        { background: var(--void);   color: var(--white); }
  .bg-cream       { background: var(--cream);  color: var(--ink); }
  .bg-pulse       { background: var(--pulse);  color: var(--ink); }
  .bg-warmth      { background: var(--warmth); color: var(--white); }
  .bg-clarity     { background: var(--clarity);color: var(--white); }

  /* Seta de continuidade — topo direito */
  .swipe-arrow {
    position: absolute;
    top: 90px;
    right: 90px;
    z-index: 5;
  }

  /* Numeração slides internos */
  .slide-num {
    position: absolute;
    top: 90px;
    left: 90px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    font-style: italic;
    letter-spacing: 0.04em;
    z-index: 5;
  }

  /* Logo topo — capas */
  .logo-top {
    position: absolute;
    top: 90px;
    right: 90px;
    z-index: 5;
  }
  .logo-top img { height: 40px; width: auto; display: block; }

  /* Rodapé */
  .footer {
    position: absolute;
    bottom: 90px;
    left: 90px;
    right: 90px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
  }
  .footer .handle {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.04em;
    opacity: 0.45;
  }
  .footer .signature {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 18px;
    font-weight: 400;
    opacity: 0.35;
    letter-spacing: 0.04em;
  }

  /* Conteúdo central */
  .content {
    position: relative;
    z-index: 2;
    width: 100%;
  }

  /* CTA */
  .has-cta .content {
    position: absolute;
    top: 90px;
    bottom: 90px;
    left: 90px;
    right: 90px;
    width: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 3;
  }

  /* Full-bleed image */
  .fullbleed-image-area {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover;
    background-position: center;
    z-index: 1;
  }
  .fullbleed-image-area::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      linear-gradient(to bottom,
        rgba(19,17,30,0.65) 0%,
        rgba(19,17,30,0.15) 25%,
        rgba(19,17,30,0.10) 55%,
        rgba(19,17,30,0.88) 100%);
    pointer-events: none;
  }
  .has-fullbleed .content {
    position: absolute;
    top: 90px; left: 90px; right: 90px; bottom: 120px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    z-index: 3;
  }

  /* Tipografia CitraChat */
  .d1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 200px; font-weight: 800; line-height: 0.88; letter-spacing: -0.06em; }
  .d2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 140px; font-weight: 800; line-height: 0.90; letter-spacing: -0.05em; }
  .h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 96px;  font-weight: 800; line-height: 0.95; letter-spacing: -0.04em; }
  .h2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 72px;  font-weight: 700; line-height: 1.0;  letter-spacing: -0.03em; }
  .h3 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 52px;  font-weight: 600; line-height: 1.1;  letter-spacing: -0.025em; }
  .body-lg { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 44px; font-weight: 500; line-height: 1.45; }
  .body-md { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; font-weight: 400; line-height: 1.5; }
  .label   { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }

  /* Color helpers */
  .pulse    { color: var(--pulse); }
  .warmth   { color: var(--warmth); }
  .clarity  { color: var(--clarity); }
  .ember    { color: var(--ember); }
  .white    { color: var(--white); }
  .ink      { color: var(--ink); }
  .muted    { opacity: 0.45; }
  .outline  { -webkit-text-stroke: 2px currentColor; color: transparent; }
</style>
</head>
<body>
  <div class="slide {{BG_CLASS}}">
    {{COVER_IMAGE}}
    {{TOP_LEFT}}
    {{TOP_RIGHT}}
    {{SWIPE_ARROW}}
    <div class="content">
      {{CONTENT}}
    </div>
    {{FOOTER}}
  </div>
</body>
</html>
