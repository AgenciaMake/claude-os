<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pulse:       #C8FF2E;
    --pulse-dark:  #2F6B10;
    --warmth:      #E05C3E;
    --clarity:     #3E88D4;
    --ember:       #E8A040;
    --void:        #13111E;
    --cream:       #F8F4EB;
    --ink:         #13111E;
    --white:       #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .slide {
    position: relative;
    width: 1080px;
    height: 1350px;
    /* Grade CitraChat: 90px em todos os lados */
    padding: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }

  /* Backgrounds */
  .bg-void        { background: var(--void);   color: var(--white); }
  .bg-cream       { background: var(--cream);  color: var(--ink); }
  .bg-pulse       { background: var(--pulse);  color: var(--ink); }
  .bg-warmth      { background: var(--warmth); color: var(--white); }
  .bg-clarity     { background: var(--clarity);color: var(--white); }

  /* Seta de continuidade — topo direito */
  .swipe-arrow {
    position: absolute;
    top: 90px;
    right: 90px;
    z-index: 5;
  }

  /* Numeração slides internos */
  .slide-num {
    position: absolute;
    top: 90px;
    left: 90px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    font-style: italic;
    letter-spacing: 0.04em;
    z-index: 5;
  }

  /* Logo topo — capas */
  .logo-top {
    position: absolute;
    top: 90px;
    right: 90px;
    z-index: 5;
  }
  .logo-top img { height: 40px; width: auto; display: block; }

  /* Rodapé */
  .footer {
    position: absolute;
    bottom: 90px;
    left: 90px;
    right: 90px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
  }
  .footer .handle {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.04em;
    opacity: 0.45;
  }
  .footer .signature {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 18px;
    font-weight: 400;
    opacity: 0.35;
    letter-spacing: 0.04em;
  }

  /* Conteúdo central */
  .content {
    position: relative;
    z-index: 2;
    width: 100%;
  }

  /* CTA */
  .has-cta .content {
    position: absolute;
    top: 90px;
    bottom: 90px;
    left: 90px;
    right: 90px;
    width: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 3;
  }

  /* Full-bleed image */
  .fullbleed-image-area {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover;
    background-position: center;
    z-index: 1;
  }
  .fullbleed-image-area::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      linear-gradient(to bottom,
        rgba(19,17,30,0.65) 0%,
        rgba(19,17,30,0.15) 25%,
        rgba(19,17,30,0.10) 55%,
        rgba(19,17,30,0.88) 100%);
    pointer-events: none;
  }
  .has-fullbleed .content {
    position: absolute;
    top: 90px; left: 90px; right: 90px; bottom: 120px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    z-index: 3;
  }

  /* Side image — foto à direita, fade para o fundo à esquerda */
  .side-image-area {
    position: absolute;
    top: 0; right: 0;
    width: 52%;
    height: 100%;
    background-size: cover;
    background-position: center top;
    z-index: 1;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.6) 30%, black 100%);
    mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.6) 30%, black 100%);
  }
  .has-side-image .content {
    position: absolute;
    top: 90px; left: 90px; right: 90px; bottom: 120px;
    width: 52%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 3;
  }

  /* Logo reposicionado pra esquerda no modo cover-image */
  .has-cover-image .logo-top {
    left: 90px;
    right: auto;
  }

  /* Cover image — foto no topo, texto embaixo */
  .cover-image-area {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 55%;
    background-size: cover;
    background-position: center;
    z-index: 1;
  }
  .cover-image-area::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 45%;
    background: linear-gradient(to bottom, rgba(19,17,30,0.75) 0%, transparent 100%);
    pointer-events: none;
    z-index: 2;
  }
  .cover-image-area::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 55%;
    background: linear-gradient(to bottom, transparent 0%, var(--void) 100%);
    pointer-events: none;
  }
  .cover-text-area {
    position: absolute;
    top: 55%; left: 90px; right: 90px; bottom: 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 3;
  }
  .has-cover-image .content {
    position: absolute;
    top: 57%; left: 90px; right: 90px; bottom: 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 3;
    width: auto;
  }

  /* Tipografia CitraChat — baseado no Instagram Brand Guide (Claude Design, Jun 2026)
     Mínimos: Número Hero 180px · Headline 72px · Sub-headline 52px · Body 34px · Label 26px · Assinatura 28px */

  /* Número Hero — dado único por slide, impacto máximo */
  .hero-num { font-family: 'Bricolage Grotesque', sans-serif; font-size: 240px; font-weight: 800; line-height: 0.88; letter-spacing: -0.05em; }

  /* Display — uso livre em layouts de impacto extremo */
  .d1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 200px; font-weight: 800; line-height: 0.88; letter-spacing: -0.06em; }
  .d2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 140px; font-weight: 800; line-height: 0.90; letter-spacing: -0.05em; }

  /* Headlines — Bricolage 800, letra-espacamento negativo */
  .h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 96px;  font-weight: 800; line-height: 0.95; letter-spacing: -0.04em; }
  .h2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 72px;  font-weight: 700; line-height: 1.0;  letter-spacing: -0.04em; }

  /* Sub-headline — Bricolage 600, ideal 60-72px */
  .h3 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 60px;  font-weight: 600; line-height: 1.1;  letter-spacing: -0.025em; }

  /* Body — Plus Jakarta Sans, line-height respira */
  .body-lg { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 42px; font-weight: 500; line-height: 1.5; }
  .body-md { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; font-weight: 400; line-height: 1.55; }

  /* Label / Tag — uppercase, tracking positivo, mín 26px */
  .label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }

  /* Contexto de dado — Jakarta 400-500, mín 34px */
  .dado-ctx { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 38px; font-weight: 400; line-height: 1.5; }

  /* Fonte / período — discreto, muted */
  .dado-fonte { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; font-weight: 400; letter-spacing: 0.04em; opacity: 0.45; }

  /* Color helpers */
  .pulse    { color: var(--pulse); }
  .pulse-dark { color: var(--pulse-dark); }
  .warmth   { color: var(--warmth); }
  .clarity  { color: var(--clarity); }
  .ember    { color: var(--ember); }
  .white    { color: var(--white); }
  .ink      { color: var(--ink); }
  .muted    { opacity: 0.45; }
  .outline  { -webkit-text-stroke: 2px currentColor; color: transparent; }

  /* Indicadores de variação em dados */
  .up   { color: var(--pulse); }
  .down { color: var(--ember); }
</style>
</head>
<body>
  <div class="slide {{BG_CLASS}}">
    {{COVER_IMAGE}}
    {{TOP_LEFT}}
    {{TOP_RIGHT}}
    {{SWIPE_ARROW}}
    <div class="content">
      {{CONTENT}}
    </div>
    {{FOOTER}}
  </div>
</body>
</html>
