name: Deploy makelemonad-prr

on:
  push:
    branches: [main]
    paths:
      - 'apps/makelemonad-prr/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_MAKE }}
          accountId: 57d45d762c6f977abb1f0e311da3ae9a
          projectName: makelemonad-prr
          directory: apps/makelemonad-prr
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
